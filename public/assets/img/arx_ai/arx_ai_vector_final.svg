  <title id="title">ARX AI</title>
  <desc id="desc">Illustration vectorielle ARX AI : nuage abstrait bleu cyan orange, réseau géométrique, losanges et médaillon noir central.</desc>

  <defs>
    <!-- Palette ARX -->
    <linearGradient id="backBlob" x1="170" y1="850" x2="1080" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07145f"/>
      <stop offset=".24" stop-color="#083f99"/>
      <stop offset=".52" stop-color="#078fc5"/>
      <stop offset=".73" stop-color="#10cfe6"/>
      <stop offset=".88" stop-color="#36dbe9"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>

    <linearGradient id="middleBlob" x1="170" y1="800" x2="1060" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06155f"/>
      <stop offset=".34" stop-color="#0753aa"/>
      <stop offset=".68" stop-color="#08b9dd"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>

    <linearGradient id="frontBlob" x1="220" y1="790" x2="980" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a2376"/>
      <stop offset=".42" stop-color="#087fc0"/>
      <stop offset=".78" stop-color="#13cfe6"/>
      <stop offset="1" stop-color="#46e0eb"/>
    </linearGradient>

    <linearGradient id="orangeGlow" x1="470" y1="220" x2="1060" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb276" stop-opacity=".42"/>
      <stop offset=".48" stop-color="#ff6b35" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ff6b35" stop-opacity=".68"/>
    </linearGradient>

    <linearGradient id="badge" x1="485" y1="355" x2="880" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#292929"/>
      <stop offset=".46" stop-color="#171717"/>
      <stop offset=".48" stop-color="#090909"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#44f3fa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00dbe9" stop-opacity=".15"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

